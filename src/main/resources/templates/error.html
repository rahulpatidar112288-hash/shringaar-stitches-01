<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <th:block th:replace="~{fragments/layout :: head(${status == 404} ? 'Page not found' : 'Something went wrong')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<main id="main" class="confirm">
  <svg th:replace="~{fragments/layout :: mark(60, 72)}"></svg>
  <p class="eyebrow" th:text="${status}">404</p>
  <h1 class="h2" th:text="${status == 404} ? 'We couldn’t find that page' : 'Something went wrong'">We couldn't find that page</h1>
  <p class="lead" style="margin: 0 auto">Try the collections, or message us and we'll help.</p>
  <div class="btn-row" style="justify-content: center">
    <a href="/collections" class="btn">Shop collections</a>
    <a href="/enquire" target="_blank" rel="noopener nofollow" class="btn btn-whatsapp">Chat on WhatsApp</a>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
