# Activate with: SPRING_PROFILES_ACTIVE=prod
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/shringaar}
spring.datasource.username=${DATABASE_USERNAME:shringaar}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
store.seed-sample-data=${STORE_SEED_SAMPLE_DATA:false}
