spring.application.name=shringaar-stitches
server.port=${PORT:8080}

# ---- Business details (override with environment variables in production) ----
store.name=Shringaar Stitches
store.tagline=Tailored Indian designer wear
# Digits only: country code + number, no "+" or spaces. e.g. 919876543210
store.whatsapp-number=${STORE_WHATSAPP_NUMBER:919340373696}
store.whatsapp-greeting=Hi Shringaar Stitches, I'd like to know more about your designs.
store.phone=${STORE_PHONE:[PHONE]}
store.email=${STORE_EMAIL:[EMAIL]}
store.address=${STORE_ADDRESS:[ADDRESS]}
store.city=${STORE_CITY:[CITY]}
store.instagram-url=${STORE_INSTAGRAM_URL:https://instagram.com/}
store.currency-symbol=\u20B9
store.upload-dir=${STORE_UPLOAD_DIR:./data/uploads}
store.seed-sample-data=${STORE_SEED_SAMPLE_DATA:true}
store.timezone=${STORE_TIMEZONE:Asia/Kolkata}

# ---- Automatic WhatsApp confirmations and reminders (WhatsApp Business Cloud API) ----
# Off until configured. See README "Automatic WhatsApp reminders".
store.whatsapp-api.enabled=${WHATSAPP_API_ENABLED:false}
store.whatsapp-api.access-token=${WHATSAPP_API_TOKEN:}
store.whatsapp-api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
store.whatsapp-api.api-version=${WHATSAPP_API_VERSION:v21.0}
store.whatsapp-api.language=${WHATSAPP_TEMPLATE_LANGUAGE:en}
store.whatsapp-api.confirmation-template=${WHATSAPP_CONFIRMATION_TEMPLATE:appointment_confirmation}
store.whatsapp-api.reminder-template=${WHATSAPP_REMINDER_TEMPLATE:appointment_reminder}

# Admin login for /admin. CHANGE THE PASSWORD before going live.
store.admin.username=${ADMIN_USERNAME:admin}
store.admin.password=${ADMIN_PASSWORD:change-me}

# ---- Database: local file-based H2 (data survives restarts) ----
spring.datasource.url=jdbc:h2:file:./data/shringaar;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
server.servlet.session.timeout=4h
server.error.whitelabel.enabled=false
